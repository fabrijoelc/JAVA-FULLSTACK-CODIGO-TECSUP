spring.application.name=hexagonal-sunat

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hexagonal_sunat}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:cero}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

decolecta.api.base-url=${DECOLECTA_API_BASE_URL:https://api.decolecta.com/v1/sunat/}
decolecta.api.token=${DECOLECTA_API_TOKEN:}
